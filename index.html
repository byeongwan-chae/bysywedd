<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Wedding · 우리의 결혼 준비</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sage-50:#f5f7f3;--sage-100:#e8ede1;--sage-200:#d4ddc7;--sage-300:#b5c4a3;
  --sage-400:#94a87f;--sage-500:#758d62;--sage-600:#5c724b;--sage-700:#485a3d;
  --sage-800:#3a4a32;--sage-900:#2a3624;
  --cream:#faf8f3;--ink:#2c2c2a;--ink-soft:#6b6b66;--ink-light:#a8a8a3;
  --rose:#c9a896;
  --apple-font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Pretendard","Helvetica Neue",Arial,sans-serif;
}
body {
  font-family:var(--apple-font);
  background:var(--cream);
  min-height:100vh;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
}
.botanical-bg {
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;opacity:0.4;z-index:0;
}
.container { max-width:760px;margin:0 auto;padding:2rem 1.25rem 4rem;position:relative;z-index:1; }

/* LOGIN */
.login-screen {
  max-width:440px;margin:4rem auto;text-align:center;
  padding:3.5rem 2rem;
  background:rgba(255,255,255,0.6);
  border:1px solid var(--sage-200);border-radius:2px;
  backdrop-filter:blur(8px);
}
.ornament { display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:1.5rem; }
.ornament .line { width:40px;height:1px;background:var(--sage-400); }
.login-screen h1 { font-size:34px;font-weight:200;color:var(--sage-800);letter-spacing:-0.02em;margin-bottom:10px; }
.login-screen .subtitle { color:var(--ink-soft);font-size:13px;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:2.5rem; }
.login-input {
  width:100%;padding:14px 0;font-size:15px;
  border:none;border-bottom:1px solid var(--sage-300);
  background:transparent;margin-bottom:1.25rem;
  font-family:inherit;outline:none;transition:border-color 0.3s;color:var(--ink);
}
.login-input::placeholder { color:var(--ink-light);font-size:14px; }
.login-input:focus { border-color:var(--sage-600); }
.login-btn {
  width:100%;padding:16px;
  background:var(--sage-700);color:var(--cream);
  border:none;font-size:12px;font-weight:500;
  letter-spacing:0.25em;text-transform:uppercase;
  cursor:pointer;font-family:inherit;margin-top:1rem;
  transition:background 0.25s;
}
.login-btn:hover { background:var(--sage-900); }
.login-hint { margin-top:2.5rem;font-size:12px;color:var(--ink-light);line-height:1.8; }

/* HERO */
.hero { text-align:center;padding:3rem 1rem 2rem;margin-bottom:1.5rem; }
.hero-orn { display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:1.5rem;color:var(--sage-500); }
.hero-orn .line { width:50px;height:1px;background:var(--sage-400); }
.hero h1 { font-size:48px;font-weight:200;color:var(--sage-800);letter-spacing:-0.03em;line-height:1;margin-bottom:14px; }
.hero .subtitle { font-size:13px;color:var(--ink-soft);letter-spacing:0.3em;text-transform:uppercase;margin-bottom:1.5rem; }
.hero .dday { font-size:20px;color:var(--sage-700);font-weight:300;margin-bottom:8px; }
.hero .date { font-size:13px;color:var(--ink-light);letter-spacing:0.2em;margin-bottom:4px; }
.hero .venue { font-size:13px;color:var(--sage-600);letter-spacing:0.15em; }
.hero-meta {
  display:flex;justify-content:center;align-items:center;
  gap:24px;margin-top:1.5rem;
  font-size:11px;color:var(--ink-light);
  letter-spacing:0.15em;text-transform:uppercase;flex-wrap:wrap;
}
.sync-indicator { display:inline-flex;align-items:center;gap:6px; }
.sync-dot { width:6px;height:6px;border-radius:50%;background:var(--sage-500);animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.logout-btn {
  background:none;border:none;color:var(--ink-light);
  font-size:11px;letter-spacing:0.15em;text-transform:uppercase;
  cursor:pointer;font-family:inherit;padding:4px 8px;
}
.logout-btn:hover { color:var(--sage-700); }

/* TABS */
.tabs {
  display:flex;justify-content:center;
  border-bottom:1px solid var(--sage-200);margin-bottom:2rem;
}
.tab {
  background:none;border:none;padding:14px 24px;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:500;
  letter-spacing:0.2em;text-transform:uppercase;
  color:var(--ink-light);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:all 0.2s;
}
.tab:hover { color:var(--sage-700); }
.tab.active { color:var(--sage-800);border-bottom-color:var(--sage-700); }
.tab-content { display:none; }
.tab-content.active { display:block; }

/* ============ TIMELINE ============ */
.timeline-header {
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:1.5rem;
}
.timeline-header h2 { font-size:22px;font-weight:300;color:var(--sage-800);letter-spacing:-0.02em; }
.timeline-header small { font-size:11px;color:var(--ink-light);letter-spacing:0.15em;text-transform:uppercase; }

.timeline-phase {
  margin-bottom:2rem;
}
.phase-label {
  display:flex;align-items:center;gap:12px;
  margin-bottom:1rem;
}
.phase-badge {
  display:inline-flex;align-items:center;
  padding:4px 14px;font-size:10px;font-weight:500;
  letter-spacing:0.2em;text-transform:uppercase;
  border:1px solid;
}
.phase-badge.urgent { background:#fef3f2;border-color:#f5c6c6;color:#9b3333; }
.phase-badge.soon   { background:#fdf8f0;border-color:#f0d9b5;color:#8a6020; }
.phase-badge.later  { background:var(--sage-50);border-color:var(--sage-200);color:var(--sage-700); }
.phase-badge.done-phase { background:#f0f7f0;border-color:#c3dfc3;color:#2e6b2e; }

.phase-line { flex:1;height:1px;background:var(--sage-200); }

.timeline-card {
  background:rgba(255,255,255,0.7);
  border:1px solid var(--sage-200);
  margin-bottom:8px;
  display:flex;align-items:center;
  padding:14px 1.25rem;
  gap:14px;
  cursor:pointer;
  transition:border-color 0.2s,background 0.2s;
}
.timeline-card:hover { border-color:var(--sage-400);background:rgba(255,255,255,0.9); }
.timeline-card.done-card {
  opacity:0.55;
  background:rgba(245,247,243,0.6);
}
.tl-check {
  width:20px;height:20px;
  border:1px solid var(--sage-400);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.2s;background:white;
}
.tl-check.checked { background:var(--sage-700);border-color:var(--sage-700); }
.tl-check.checked svg { width:11px;height:11px;stroke:white;stroke-width:2.5;fill:none; }
.tl-body { flex:1;min-width:0; }
.tl-title {
  font-size:14px;color:var(--ink);font-weight:400;line-height:1.4;
  transition:color 0.2s;
}
.tl-title.done-text { color:var(--ink-light);text-decoration:line-through;text-decoration-color:var(--sage-400); }
.tl-meta { font-size:11px;color:var(--ink-light);margin-top:3px; }
.tl-cat {
  font-size:9px;padding:2px 10px;
  background:var(--sage-100);color:var(--sage-700);
  letter-spacing:0.15em;text-transform:uppercase;
  white-space:nowrap;
}
.tl-time {
  font-size:11px;color:var(--ink-light);
  text-align:right;white-space:nowrap;
  letter-spacing:0.05em;min-width:52px;
}
.tl-time.urgent-time { color:#9b3333;font-weight:500; }
.tl-time.soon-time { color:#8a6020; }

.timeline-empty {
  text-align:center;padding:3rem;
  color:var(--ink-light);font-size:14px;
  background:rgba(255,255,255,0.5);border:1px solid var(--sage-200);
}

/* ============ CHECKLIST ============ */
.section-title { text-align:center;font-size:26px;font-weight:300;color:var(--sage-800);margin:3rem 0 1.5rem;letter-spacing:-0.02em; }
.section-subtitle { text-align:center;font-size:11px;color:var(--ink-light);letter-spacing:0.3em;text-transform:uppercase;margin-bottom:2rem; }

.category {
  background:rgba(255,255,255,0.65);
  border:1px solid var(--sage-200);
  margin-bottom:1rem;overflow:hidden;transition:border-color 0.2s;
}
.category:hover { border-color:var(--sage-300); }
.cat-header {
  display:flex;align-items:center;gap:16px;
  padding:1.25rem 1.5rem;cursor:pointer;user-select:none;
}
.cat-num { font-size:20px;color:var(--sage-500);font-weight:200;min-width:32px;letter-spacing:-0.02em; }
.cat-title { font-size:16px;font-weight:400;color:var(--sage-800);flex:1;letter-spacing:0.02em; }
.cat-progress { font-size:13px;color:var(--ink-soft);font-feature-settings:"tnum"; }
.cat-progress.done { color:var(--sage-600); }
.cat-chevron { color:var(--sage-400);font-size:10px;transition:transform 0.3s;margin-left:8px; }
.collapsed .cat-chevron { transform:rotate(-90deg); }
.collapsed .cat-body { display:none; }
.cat-body { border-top:1px solid var(--sage-200);background:rgba(255,255,255,0.4); }

.item {
  display:flex;align-items:center;gap:14px;
  padding:14px 1.5rem;border-bottom:1px solid var(--sage-100);
  cursor:pointer;transition:background 0.15s;
}
.item:last-of-type { border-bottom:none; }
.item:hover { background:var(--sage-50); }
.checkbox {
  width:18px;height:18px;border:1px solid var(--sage-400);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.2s;background:white;
}
.checkbox.checked { background:var(--sage-700);border-color:var(--sage-700); }
.checkbox.checked svg { width:11px;height:11px;stroke:white;stroke-width:2.5;fill:none; }
.item-content { flex:1;min-width:0; }
.item-text { font-size:14px;color:var(--ink);font-weight:400;line-height:1.5;transition:color 0.2s; }
.item-text.checked { color:var(--ink-light);text-decoration:line-through;text-decoration-color:var(--sage-400); }
.item-meta { font-size:11px;color:var(--ink-light);margin-top:4px;font-style:italic; }
.item-tag { font-size:9px;padding:3px 10px;background:var(--sage-100);color:var(--sage-700);letter-spacing:0.15em;text-transform:uppercase;font-weight:500; }
.item-delete { background:none;border:none;color:var(--ink-light);cursor:pointer;font-size:14px;padding:4px 8px;opacity:0;transition:all 0.15s; }
.item:hover .item-delete { opacity:1; }
.item-delete:hover { color:var(--rose); }
.add-btn {
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px;font-size:11px;color:var(--sage-600);
  cursor:pointer;width:100%;background:none;border:none;
  border-top:1px solid var(--sage-100);font-family:inherit;
  letter-spacing:0.25em;text-transform:uppercase;transition:all 0.2s;
}
.add-btn:hover { background:var(--sage-50);color:var(--sage-800); }
.add-input-row {
  display:flex;gap:8px;padding:12px 1.5rem;
  border-top:1px solid var(--sage-100);background:var(--sage-50);
}
.add-input-row input {
  flex:1;font-size:13px;padding:8px 12px;
  border:1px solid var(--sage-300);background:white;
  outline:none;font-family:inherit;border-radius:0;
}
.add-input-row input:focus { border-color:var(--sage-600); }
.add-input-row button {
  font-size:10px;padding:8px 16px;border:none;
  background:var(--sage-700);color:white;cursor:pointer;
  font-family:inherit;letter-spacing:0.2em;text-transform:uppercase;
}
.add-input-row button.cancel {
  background:transparent;color:var(--ink-soft);border:1px solid var(--sage-300);
}

/* ============ BUDGET ============ */
.budget-summary {
  display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(255,255,255,0.5);border:1px solid var(--sage-200);margin-bottom:2rem;
}
.budget-stat { padding:1.5rem 1rem;text-align:center;border-right:1px solid var(--sage-200); }
.budget-stat:last-child { border-right:none; }
.budget-stat-label { font-size:10px;color:var(--ink-soft);letter-spacing:0.25em;text-transform:uppercase;margin-bottom:10px; }
.budget-stat-num { font-size:22px;font-weight:300;color:var(--sage-800);letter-spacing:-0.02em;font-feature-settings:"tnum"; }
.budget-stat-num.negative { color:#9b3333; }
.budget-stat-num.positive { color:var(--sage-700); }
.budget-stat-sub { font-size:11px;color:var(--ink-light);margin-top:4px; }

.budget-actions { display:flex;gap:10px;margin-bottom:1.5rem;flex-wrap:wrap; }
.btn {
  flex:1;min-width:120px;padding:12px 16px;
  border:1px solid var(--sage-400);background:white;color:var(--sage-700);
  font-family:inherit;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;
  cursor:pointer;transition:all 0.2s;font-weight:500;
}
.btn:hover { background:var(--sage-700);color:white;border-color:var(--sage-700); }
.btn.primary { background:var(--sage-700);color:white;border-color:var(--sage-700); }
.btn.primary:hover { background:var(--sage-900);border-color:var(--sage-900); }

.budget-filter { display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap; }
.filter-chip {
  padding:6px 14px;font-size:11px;
  background:white;border:1px solid var(--sage-200);
  color:var(--ink-soft);cursor:pointer;letter-spacing:0.1em;transition:all 0.2s;
}
.filter-chip:hover { border-color:var(--sage-400); }
.filter-chip.active { background:var(--sage-700);color:white;border-color:var(--sage-700); }

.budget-table { background:rgba(255,255,255,0.65);border:1px solid var(--sage-200);overflow:hidden; }
.budget-row {
  display:grid;grid-template-columns:80px 1fr 100px 110px 28px;
  gap:10px;padding:13px 1.25rem;
  border-bottom:1px solid var(--sage-100);
  align-items:center;font-size:13px;cursor:pointer;
  transition:background 0.15s;
}
.budget-row:hover { background:var(--sage-50); }
.budget-row:last-child { border-bottom:none; }
.budget-row.header {
  background:var(--sage-50);font-size:10px;
  color:var(--ink-soft);letter-spacing:0.2em;text-transform:uppercase;
  font-weight:500;cursor:default;
}
.budget-row.header:hover { background:var(--sage-50); }
.budget-date { color:var(--ink-soft);font-size:12px;font-feature-settings:"tnum"; }
.budget-desc { color:var(--ink); }
.budget-desc .cat-label {
  display:inline-block;font-size:10px;
  padding:2px 8px;background:var(--sage-100);
  color:var(--sage-700);margin-left:6px;
  letter-spacing:0.1em;text-transform:uppercase;
}
.budget-amount { text-align:right;font-feature-settings:"tnum";font-weight:500; }
.budget-amount.expense { color:#9b3333; }
.budget-amount.income { color:var(--sage-700); }
.budget-delete { background:none;border:none;color:var(--ink-light);cursor:pointer;font-size:14px;opacity:0; }
.budget-row:hover .budget-delete { opacity:1; }
.budget-delete:hover { color:#9b3333; }
.budget-empty { text-align:center;padding:3rem 1rem;color:var(--ink-light); }

/* MODAL */
.modal-overlay {
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(42,54,36,0.5);
  display:none;align-items:center;justify-content:center;
  z-index:100;backdrop-filter:blur(4px);
}
.modal-overlay.show { display:flex; }
.modal {
  background:var(--cream);border:1px solid var(--sage-300);
  max-width:440px;width:90%;padding:2rem;
  max-height:90vh;overflow-y:auto;
}
.modal h3 { font-size:22px;font-weight:300;color:var(--sage-800);margin-bottom:1.5rem;letter-spacing:-0.02em;text-align:center; }
.form-group { margin-bottom:1.25rem; }
.form-label { display:block;font-size:10px;color:var(--ink-soft);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:6px; }
.form-input,.form-select {
  width:100%;padding:10px 12px;border:1px solid var(--sage-300);
  background:white;font-size:14px;font-family:inherit;
  outline:none;border-radius:0;
}
.form-input:focus,.form-select:focus { border-color:var(--sage-600); }
.form-row { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
.form-actions { display:flex;gap:12px;margin-top:1.5rem; }
.form-actions .btn { flex:1; }
.type-toggle { display:flex;border:1px solid var(--sage-300); }
.type-toggle button {
  flex:1;padding:10px;background:white;border:none;
  font-family:inherit;font-size:12px;cursor:pointer;
  color:var(--ink-soft);letter-spacing:0.15em;text-transform:uppercase;transition:all 0.2s;
}
.type-toggle button.active { background:var(--sage-700);color:white; }

/* FOOTER */
.footer-ornament {
  display:flex;align-items:center;justify-content:center;
  gap:16px;margin-top:4rem;padding-top:2rem;color:var(--sage-400);
}
.footer-ornament .line { width:80px;height:1px;background:var(--sage-300); }
.footer-ornament .text { font-weight:300;font-size:13px;color:var(--sage-600);letter-spacing:0.05em; }

/* MOBILE */
@media (max-width:600px) {
  .container { padding:1rem 1rem 3rem; }
  .hero { padding:2rem 0.5rem 1.5rem; }
  .hero h1 { font-size:36px; }
  .tab { padding:12px 14px;font-size:11px;letter-spacing:0.12em; }
  .cat-header { padding:1rem 1.25rem;gap:12px; }
  .cat-num { font-size:17px;min-width:26px; }
  .cat-title { font-size:15px; }
  .item { padding:12px 1.25rem; }
  .budget-row { grid-template-columns:1fr 90px 24px;gap:8px; }
  .budget-row .budget-date,.budget-row.header .col-date { display:none; }
  .budget-summary { grid-template-columns:1fr; }
  .budget-stat { border-right:none;border-bottom:1px solid var(--sage-200); }
  .budget-stat:last-child { border-bottom:none; }
  .btn { font-size:10px;padding:10px 10px;letter-spacing:0.12em; }
  .tl-time { display:none; }
}
</style>
</head>
<body>

<svg class="botanical-bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <g opacity="0.5" stroke="#94a87f" stroke-width="0.8" fill="none">
    <path d="M-20,80 Q60,60 100,120 Q140,180 200,160"/>
    <ellipse cx="80" cy="85" rx="8" ry="3" fill="#b5c4a3" stroke="none" transform="rotate(-25 80 85)"/>
    <ellipse cx="110" cy="130" rx="9" ry="3.5" fill="#b5c4a3" stroke="none" transform="rotate(15 110 130)"/>
    <ellipse cx="150" cy="155" rx="8" ry="3" fill="#b5c4a3" stroke="none" transform="rotate(-10 150 155)"/>
  </g>
  <g opacity="0.5" stroke="#94a87f" stroke-width="0.8" fill="none">
    <path d="M1460,60 Q1380,80 1340,140 Q1300,200 1240,170"/>
    <ellipse cx="1370" cy="95" rx="8" ry="3" fill="#b5c4a3" stroke="none" transform="rotate(25 1370 95)"/>
    <ellipse cx="1330" cy="145" rx="9" ry="3.5" fill="#b5c4a3" stroke="none" transform="rotate(-15 1330 145)"/>
  </g>
  <g opacity="0.4" stroke="#94a87f" stroke-width="0.8" fill="none">
    <path d="M-30,820 Q40,790 90,830 Q150,870 220,840"/>
    <ellipse cx="60" cy="800" rx="9" ry="3.5" fill="#b5c4a3" stroke="none" transform="rotate(-15 60 800)"/>
    <ellipse cx="120" cy="850" rx="8" ry="3" fill="#b5c4a3" stroke="none" transform="rotate(20 120 850)"/>
  </g>
  <g opacity="0.4" stroke="#94a87f" stroke-width="0.8" fill="none">
    <path d="M1470,850 Q1390,820 1350,860 Q1290,890 1230,860"/>
    <ellipse cx="1380" cy="830" rx="8" ry="3" fill="#b5c4a3" stroke="none" transform="rotate(15 1380 830)"/>
    <ellipse cx="1320" cy="875" rx="9" ry="3.5" fill="#b5c4a3" stroke="none" transform="rotate(-20 1320 875)"/>
  </g>
</svg>

<div class="container">
  <!-- LOGIN -->
  <div id="login-screen" class="login-screen">
    <div class="ornament">
      <div class="line"></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#758d62" stroke-width="1.5">
        <path d="M12 2 Q6 8 6 14 Q6 20 12 22 Q18 20 18 14 Q18 8 12 2"/><line x1="12" y1="2" x2="12" y2="22"/>
      </svg>
      <div class="line"></div>
    </div>
    <h1>Our Wedding</h1>

let coupleCode = null, userName = null;
let state = { checked:{}, custom:{}, lastUpdate:{}, budget:{ entries:[], totalBudget:0 } };
let collapsed = {}, addingIn = {};
let unsubscribe = null, isApplyingRemote = false;
let currentEntryType = 'expense', editingEntryId = null, currentFilter = 'all';

function updateDday() {
  const wedding = new Date(WEDDING_DATE);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.ceil((wedding - today) / 86400000);
  const el = document.getElementById('dday');
  if (diff > 0) el.textContent = `D-${diff}`;
  else if (diff === 0) el.textContent = `Today is the day`;
  else el.textContent = `Day ${-diff} of marriage`;
  const d = new Date(WEDDING_DATE);
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('wedding-date-text').textContent = `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

window.login = function() {
  const code = document.getElementById('couple-code-input').value.trim().toLowerCase();
  const name = document.getElementById('name-input').value.trim() || 'Anonymous';
  if (!code || code.length < 4) { alert('커플 코드를 4자 이상 입력해 주세요'); return; }
  coupleCode = code; userName = name;
  localStorage.setItem('wedding_couple_code', code);
  localStorage.setItem('wedding_user_name', name);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('couple-info').textContent = `${name} · ${code}`;
  updateDday();
  startSync();
};

window.logout = function() {
  if (unsubscribe) unsubscribe();
  localStorage.removeItem('wedding_couple_code');
  localStorage.removeItem('wedding_user_name');
  location.reload();
};

function startSync() {
  const docRef = doc(db, 'weddings', coupleCode);
  unsubscribe = onSnapshot(docRef, snap => {
    if (snap.exists()) {
      isApplyingRemote = true;
      const d = snap.data();
      state = { checked:d.checked||{}, custom:d.custom||{}, lastUpdate:d.lastUpdate||{}, budget:d.budget||{entries:[],totalBudget:0} };
      render(); renderTimeline(); renderBudget();
      isApplyingRemote = false;
      document.getElementById('sync-text').textContent = 'Live';
    } else {
      setDoc(docRef, { checked:{}, custom:{}, lastUpdate:{}, budget:{entries:[],totalBudget:0} });
    }
  }, err => { console.error(err); document.getElementById('sync-text').textContent = 'Offline'; });
}

async function saveState() {
  if (isApplyingRemote) return;
  try { await setDoc(doc(db,'weddings',coupleCode), state, {merge:true}); }
  catch(e) { console.error(e); }
}

window.switchTab = function(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
};

function getData() {
  return defaultData.map(cat => ({
    ...cat,
    items: [...cat.items, ...((state.custom&&state.custom[cat.id])||[])]
  }));
}

function isChecked(catId, itemId) { return !!(state.checked&&state.checked[`${catId}__${itemId}`]); }
function getCheckedBy(catId, itemId) { return state.lastUpdate&&state.lastUpdate[`${catId}__${itemId}`]; }

window.toggleCheck = function(catId, itemId, fromTimeline) {
  const key = `${catId}__${itemId}`;
  if (!state.checked) state.checked = {};
  if (!state.lastUpdate) state.lastUpdate = {};
  if (state.checked[key]) { delete state.checked[key]; delete state.lastUpdate[key]; }
  else { state.checked[key] = true; state.lastUpdate[key] = {by:userName, at:new Date().toISOString()}; }
  render(); renderTimeline(); saveState();
};

window.toggleCollapse = function(catId) { collapsed[catId]=!collapsed[catId]; render(); };
window.startAdd = function(e, catId) { e.stopPropagation(); addingIn[catId]=true; render(); };
window.cancelAdd = function(catId) { addingIn[catId]=false; render(); };
window.submitAdd = function(catId) {
  const inp = document.getElementById('new-item-'+catId);
  const text = inp?.value?.trim();
  if (!text) { addingIn[catId]=false; render(); return; }
  if (!state.custom) state.custom={};
  if (!state.custom[catId]) state.custom[catId]=[];
  state.custom[catId].push({ id:'custom_'+Date.now()+'_'+Math.random().toString(36).substr(2,5), text, tag:'', by:userName });
  addingIn[catId]=false; render(); saveState();
};
window.deleteCustom = function(e, catId, itemId) {
  e.stopPropagation();
  if (!confirm('이 항목을 삭제할까요?')) return;
  if (state.custom&&state.custom[catId]) state.custom[catId]=state.custom[catId].filter(i=>i.id!==itemId);
  const key=`${catId}__${itemId}`;
  if (state.checked) delete state.checked[key];
  if (state.lastUpdate) delete state.lastUpdate[key];
  render(); renderTimeline(); saveState();
};
window.handleEnter = function(e, catId) {
  if (e.key==='Enter') window.submitAdd(catId);
  if (e.key==='Escape') window.cancelAdd(catId);
};

function formatTime(iso) {
  if (!iso) return '';
  const d=new Date(iso), now=new Date(), diff=(now-d)/1000;
  if (diff<60) return 'just now';
  if (diff<3600) return Math.floor(diff/60)+'m ago';
  if (diff<86400) return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ========== TIMELINE ========== */
function renderTimeline() {
  const today = new Date(); today.setHours(0,0,0,0);
  const wedding = new Date(WEDDING_DATE);
  const daysLeft = Math.ceil((wedding - today) / 86400000);

  // 전체 아이템 수집 + 완료 여부 계산
  const allItems = [];
  getData().forEach(cat => {
    cat.items.forEach(item => {
      const dbw = (item.daysBeforeWedding !== undefined) ? item.daysBeforeWedding : 90;
      const dueInDays = daysLeft - dbw; // 지금부터 몇 일 후에 해야 하는가 (음수 = 이미 지났어야)
      allItems.push({
        catId: cat.id, catTitle: cat.title,
        itemId: item.id, text: item.text, tag: item.tag,
        daysBeforeWedding: dbw,
        dueInDays,
        checked: isChecked(cat.id, item.id)
      });
    });
  });

  // 미완료 항목만 분류
  const pending = allItems.filter(i => !i.checked);
  const done    = allItems.filter(i => i.checked);

  // 구간 분류
  const urgent = pending.filter(i => i.dueInDays <= 30).sort((a,b) => a.dueInDays - b.dueInDays);
  const soon   = pending.filter(i => i.dueInDays > 30 && i.dueInDays <= 90).sort((a,b) => a.dueInDays - b.dueInDays);
  const later  = pending.filter(i => i.dueInDays > 90).sort((a,b) => a.dueInDays - b.dueInDays);

  function timeLabel(dueInDays) {
    if (dueInDays < 0) return '기한 초과';
    if (dueInDays === 0) return '오늘까지';
    if (dueInDays <= 7) return `${dueInDays}일 후`;
    if (dueInDays <= 30) return `${Math.ceil(dueInDays/7)}주 후`;
    return `${Math.ceil(dueInDays/30)}개월 후`;
  }

  function cardHtml(item, phaseClass) {
    const checked = item.checked;
    const timeCls = item.dueInDays <= 14 ? 'urgent-time' : item.dueInDays <= 90 ? 'soon-time' : '';
    return `
      <div class="timeline-card ${checked ? 'done-card' : ''}" onclick="toggleCheck('${item.catId}','${item.itemId}',true)">
        <div class="tl-check ${checked ? 'checked' : ''}">
          ${checked ? '<svg viewBox="0 0 16 16"><polyline points="3,8 7,12 13,4"/></svg>' : ''}
        </div>
        <div class="tl-body">
          <div class="tl-title ${checked ? 'done-text' : ''}">${escapeHtml(item.text)}</div>
          <div class="tl-meta">${escapeHtml(item.catTitle)}</div>
        </div>
        ${item.tag ? `<span class="tl-cat">${escapeHtml(item.tag)}</span>` : ''}
        <div class="tl-time ${timeCls}">${timeLabel(item.dueInDays)}</div>
      </div>
    `;
  }

  function phaseHtml(label, badgeClass, items, showDone) {
    if (items.length === 0) return '';
    return `
      <div class="timeline-phase">
        <div class="phase-label">
          <span class="phase-badge ${badgeClass}">${label}</span>
          <div class="phase-line"></div>
          <span style="font-size:11px;color:var(--ink-light);letter-spacing:0.1em;">${items.length}건</span>
        </div>
        ${items.map(i => cardHtml(i, badgeClass)).join('')}
      </div>
    `;
  }

  const totalPending = pending.length;
  const totalAll = allItems.length;
  const pct = totalAll > 0 ? Math.round(done.length / totalAll * 100) : 0;

  let html = `
    <div class="timeline-header">
      <h2>다음 할 일</h2>
      <small>${done.length}/${totalAll} 완료 · ${pct}%</small>
    </div>
  `;

  if (totalPending === 0) {
    html += `<div class="timeline-empty">🎉 모든 항목이 완료되었어요!</div>`;
  } else {
    if (urgent.length > 0) html += phaseHtml('지금 당장', 'urgent', urgent);
    if (soon.length > 0)   html += phaseHtml('곧 해야 할 일', 'soon', soon);
    if (later.length > 0)  html += phaseHtml('앞으로 할 일', 'later', later);
  }

  // 최근 완료 3개
  if (done.length > 0) {
    const recentDone = done.slice(-3).reverse();
    html += `
      <div class="timeline-phase" style="margin-top:1rem;">
        <div class="phase-label">
          <span class="phase-badge done-phase">최근 완료</span>
          <div class="phase-line"></div>
          <span style="font-size:11px;color:var(--ink-light);letter-spacing:0.1em;">${done.length}건 완료</span>
        </div>
        ${recentDone.map(i => cardHtml(i, 'done-phase')).join('')}
      </div>
    `;
  }

  document.getElementById('timeline-content').innerHTML = html;
}

/* ========== CHECKLIST ========== */
function render() {
  const data = getData();
  const container = document.getElementById('categories');
  container.innerHTML = '';
  data.forEach((cat, idx) => {
    const checkedCount = cat.items.filter(i => isChecked(cat.id, i.id)).length;
    const total = cat.items.length;
    const allDone = total > 0 && checkedCount === total;
    const isCollapsed = collapsed[cat.id];
    const div = document.createElement('div');
    div.className = 'category' + (isCollapsed ? ' collapsed' : '');
    const num = String(idx+1).padStart(2,'0');
    div.innerHTML = `
      <div class="cat-header" onclick="toggleCollapse('${cat.id}')">
        <span class="cat-num">${num}</span>
        <span class="cat-title">${cat.title}</span>
        <span class="cat-progress ${allDone?'done':''}">${checkedCount} / ${total}</span>
        <span class="cat-chevron">▾</span>
      </div>
      <div class="cat-body">
        ${cat.items.map(item => {
          const checked = isChecked(cat.id, item.id);
          const meta = checked ? getCheckedBy(cat.id, item.id) : null;
          const isCustom = item.id.startsWith('custom_');
          return `
            <div class="item" onclick="toggleCheck('${cat.id}','${item.id}')">
              <div class="checkbox ${checked?'checked':''}">
                ${checked ? '<svg viewBox="0 0 16 16"><polyline points="3,8 7,12 13,4"/></svg>' : ''}
              </div>
              <div class="item-content">
                <div class="item-text ${checked?'checked':''}">${escapeHtml(item.text)}</div>
                ${meta ? `<div class="item-meta">${escapeHtml(meta.by)} · ${formatTime(meta.at)}</div>` : ''}
              </div>
              ${item.tag ? `<span class="item-tag">${item.tag}</span>` : ''}
              ${isCustom ? `<button class="item-delete" onclick="deleteCustom(event,'${cat.id}','${item.id}')">×</button>` : ''}
            </div>
          `;
        }).join('')}
        ${addingIn[cat.id] ? `
          <div class="add-input-row">
            <input id="new-item-${cat.id}" placeholder="새 항목 입력 후 Enter" autofocus onkeydown="handleEnter(event,'${cat.id}')"/>
            <button onclick="submitAdd('${cat.id}')">Add</button>
            <button class="cancel" onclick="cancelAdd('${cat.id}')">Cancel</button>
          </div>
        ` : `<button class="add-btn" onclick="startAdd(event,'${cat.id}')">+ Add item</button>`}
      </div>
    `;
    container.appendChild(div);
    if (addingIn[cat.id]) {
      setTimeout(() => { const inp = document.getElementById('new-item-'+cat.id); if(inp) inp.focus(); }, 50);
    }
  });
}

/* ========== BUDGET ========== */
function formatWon(n) { return '₩' + Math.round(n).toLocaleString('ko-KR'); }
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear().toString().slice(2)}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

window.filterBudget = function(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.cat===cat));
  renderBudget();
};
window.openBudgetModal = function() {
  editingEntryId = null;
  document.getElementById('modal-title').textContent = '지출 추가';
  document.getElementById('entry-desc').value = '';
  document.getElementById('entry-amount').value = '';
  document.getElementById('entry-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('entry-category').value = '예식장';
  document.getElementById('entry-memo').value = '';
  setType('expense');
  document.getElementById('budget-modal').classList.add('show');
};
window.closeBudgetModal = function() { document.getElementById('budget-modal').classList.remove('show'); };
window.openSetBudgetModal = function() {
  document.getElementById('total-budget-input').value = state.budget.totalBudget||'';
  document.getElementById('set-budget-modal').classList.add('show');
};
window.closeSetBudgetModal = function() { document.getElementById('set-budget-modal').classList.remove('show'); };
window.saveTotalBudget = function() {
  const val = parseFloat(document.getElementById('total-budget-input').value)||0;
  if (!state.budget) state.budget={entries:[],totalBudget:0};
  state.budget.totalBudget = val;
  closeSetBudgetModal(); renderBudget(); saveState();
};
window.setType = function(type) {
  currentEntryType = type;
  document.getElementById('type-expense').classList.toggle('active', type==='expense');
  document.getElementById('type-income').classList.toggle('active', type==='income');
};
window.saveBudgetEntry = function() {
  const desc = document.getElementById('entry-desc').value.trim();
  const amount = parseFloat(document.getElementById('entry-amount').value);
  const date = document.getElementById('entry-date').value;
  const category = document.getElementById('entry-category').value;
  const memo = document.getElementById('entry-memo').value.trim();
  if (!desc) { alert('내용을 입력해 주세요'); return; }
  if (!amount||amount<=0) { alert('금액을 입력해 주세요'); return; }
  if (!state.budget) state.budget={entries:[],totalBudget:0};
  if (!state.budget.entries) state.budget.entries=[];
  if (editingEntryId) {
    const en = state.budget.entries.find(e=>e.id===editingEntryId);
    if (en) { en.desc=desc; en.amount=amount; en.date=date; en.category=category; en.memo=memo; en.type=currentEntryType; }
  } else {
    state.budget.entries.push({
      id:'b_'+Date.now()+'_'+Math.random().toString(36).substr(2,5),
      desc, amount, date, category, memo, type:currentEntryType, by:userName, createdAt:new Date().toISOString()
    });
  }
  closeBudgetModal(); renderBudget(); saveState();
};
window.deleteBudgetEntry = function(e, id) {
  e.stopPropagation();
  if (!confirm('이 항목을 삭제할까요?')) return;
  if (state.budget&&state.budget.entries) state.budget.entries=state.budget.entries.filter(en=>en.id!==id);
  renderBudget(); saveState();
};
window.editBudgetEntry = function(id) {
  const en = state.budget.entries.find(e=>e.id===id);
  if (!en) return;
  editingEntryId = id;
  document.getElementById('modal-title').textContent = '항목 수정';
  document.getElementById('entry-desc').value = en.desc;
  document.getElementById('entry-amount').value = en.amount;
  document.getElementById('entry-date').value = en.date;
  document.getElementById('entry-category').value = en.category;
  document.getElementById('entry-memo').value = en.memo||'';
  setType(en.type||'expense');
  document.getElementById('budget-modal').classList.add('show');
};

function renderBudget() {
  if (!state.budget) state.budget={entries:[],totalBudget:0};
  const entries = state.budget.entries||[];
  const totalBudget = state.budget.totalBudget||0;
  const expenses = entries.filter(e=>e.type!=='income').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const incomes  = entries.filter(e=>e.type==='income').reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const spent = expenses - incomes;
  const remaining = totalBudget - spent;

  document.getElementById('budget-total').textContent = formatWon(totalBudget);
  document.getElementById('budget-total-sub').textContent = totalBudget>0?'계획 예산':'예산 미설정';
  document.getElementById('budget-spent').textContent = formatWon(spent);
  document.getElementById('budget-spent-sub').textContent = `${entries.length}건의 기록`;
  document.getElementById('budget-remaining').textContent = formatWon(remaining);
  const remEl = document.getElementById('budget-remaining');
  remEl.classList.toggle('negative', remaining<0);
  remEl.classList.toggle('positive', remaining>=0);
  document.getElementById('budget-remaining-sub').textContent =
    totalBudget>0 ? (remaining>=0 ? `${Math.round((spent/totalBudget)*100)}% 사용` : '예산 초과') : '잔여 예산';

  const filtered = currentFilter==='all' ? entries : entries.filter(e=>e.category===currentFilter);
  const sorted = [...filtered].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const tableEl = document.getElementById('budget-table');
  if (sorted.length===0) {
    tableEl.innerHTML=`<div class="budget-empty">💰 아직 기록된 내역이 없어요.<br><span style="font-size:12px;margin-top:8px;display:block;">+ 지출 추가 또는 엑셀 Import로 시작하세요</span></div>`;
    return;
  }
  let html = `
    <div class="budget-row header">
      <div>날짜</div><div>내용</div><div>카테고리</div><div style="text-align:right">금액</div><div></div>
    </div>
  `;
  sorted.forEach(e => {
    const isIncome = e.type==='income';
    html += `
      <div class="budget-row" onclick="editBudgetEntry('${e.id}')">
        <div class="budget-date">${formatDate(e.date)}</div>
        <div class="budget-desc">
          ${escapeHtml(e.desc)}
          ${e.memo ? `<div style="font-size:11px;color:var(--ink-light);margin-top:2px;">${escapeHtml(e.memo)}</div>` : ''}
        </div>
        <div style="font-size:11px;color:var(--ink-soft);">${escapeHtml(e.category)}</div>
        <div class="budget-amount ${isIncome?'income':'expense'}">${isIncome?'+':'-'}${formatWon(e.amount)}</div>
        <button class="budget-delete" onclick="deleteBudgetEntry(event,'${e.id}')">×</button>
      </div>
    `;
  });
  tableEl.innerHTML = html;
}

/* ========== EXCEL ========== */
window.handleExcelImport = function(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
      if (rows.length===0) { alert('엑셀에 데이터가 없어요.'); return; }
      const validCats = ['예식장','스튜디오','드레스/예복','청첩장','신혼여행','신혼집','예단/예물','기타'];
      if (!state.budget) state.budget={entries:[],totalBudget:0};
      if (!state.budget.entries) state.budget.entries=[];
      let imported=0, skipped=0;
      rows.forEach((row,idx) => {
        const keys=Object.keys(row);
        const fk=(patterns)=>keys.find(k=>patterns.some(p=>k.toLowerCase().includes(p.toLowerCase())));
        const dateKey=fk(['날짜','date','일자']);
        const descKey=fk(['내용','description','desc','항목','품목','content']);
        const amountKey=fk(['금액','amount','price','지출','가격']);
        const categoryKey=fk(['카테고리','category','분류','구분']);
        const memoKey=fk(['메모','memo','note','비고']);
        const typeKey=fk(['유형','type','종류']);
        let amount=parseFloat(String(row[amountKey]||'').replace(/[^\d.-]/g,''));
        let desc=String(row[descKey]||'').trim();
        if (!desc||!amount||amount===0) { skipped++; return; }
        let dateVal=row[dateKey];
        let dateStr;
        if (dateVal instanceof Date) dateStr=dateVal.toISOString().slice(0,10);
        else if (typeof dateVal==='string'&&dateVal) {
          const p=new Date(dateVal.replace(/\./g,'-').replace(/\//g,'-'));
          dateStr=isNaN(p.getTime())?new Date().toISOString().slice(0,10):p.toISOString().slice(0,10);
        } else dateStr=new Date().toISOString().slice(0,10);
        let category=String(row[categoryKey]||'기타').trim();
        if (!validCats.includes(category)) category='기타';
        const typeVal=String(row[typeKey]||'').toLowerCase();
        const type=(typeVal.includes('수입')||typeVal.includes('income')||amount<0)?'income':'expense';
        state.budget.entries.push({
          id:'b_'+Date.now()+'_'+idx+'_'+Math.random().toString(36).substr(2,5),
          desc, amount:Math.abs(amount), date:dateStr, category,
          memo:String(row[memoKey]||'').trim(), type, by:userName, createdAt:new Date().toISOString()
        });
        imported++;
      });
      renderBudget(); saveState();
      alert(`✅ ${imported}건 가져오기 완료${skipped>0?` (${skipped}건 건너뜀)`:''}`);
    } catch(err) {
      console.error(err);
      alert('엑셀 파일을 읽을 수 없어요.\n\n필요한 열: 날짜, 내용, 금액, 카테고리(선택)');
    }
    event.target.value='';
  };
  reader.readAsArrayBuffer(file);
};

window.exportToExcel = function() {
  const entries=state.budget?.entries||[];
  if (entries.length===0) { alert('내보낼 데이터가 없어요.'); return; }
  const data=[...entries].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(e=>({
    '날짜':e.date,'내용':e.desc,'카테고리':e.category,'금액':e.amount,
    '유형':e.type==='income'?'수입':'지출','메모':e.memo||'','입력자':e.by||''
  }));
  const ws=XLSX.utils.json_to_sheet(data);
  ws['!cols']=[{wch:12},{wch:30},{wch:14},{wch:14},{wch:8},{wch:24},{wch:10}];
  const wbOut=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wbOut,ws,'결혼가계부');
  XLSX.writeFile(wbOut,`wedding_budget_${new Date().toISOString().slice(0,10)}.xlsx`);
};
